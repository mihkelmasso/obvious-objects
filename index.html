</header>

  <div class="tile t5" data-speed="0.028" data-scale="0.78">

  <div class="tile t6" data-speed="-0.030" data-scale="0.72">

</main>


<section class="page contact-end">

  <h1>Contact</h1>

  <p>
    For product inquiries, commissions, availability or further information,
    please get in touch.
  </p>

  <p>
    <a href="mailto:not.so@obvious.ee">
      not.so@obvious.ee
    </a>
  </p>

  <form
    action="https://formsubmit.co/not.so@obvious.ee"
    method="POST">

    <input
      type="hidden"
      name="_subject"
      value="OBVIOUS inquiry">

    <input
      type="hidden"
      name="_captcha"
      value="false">

    <input
      type="hidden"
      name="_template"
      value="table">

    <input
      type="text"
      name="name"
      placeholder="Name"
      required>

    <input
      type="email"
      name="email"
      placeholder="Email"
      required>

    <textarea
      name="message"
      rows="6"
      placeholder="Message"
      required></textarea>

    <button type="submit">
      Send inquiry
    </button>

  </form>

</section>


<footer>

  <a href="mailto:not.so@obvious.ee">
    not.so@obvious.ee
  </a>

  <span>
    obvious © 2026
  </span>

</footer>


<script src="script.js"></script>

</body>
</html>
