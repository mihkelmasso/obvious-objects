<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OBVIOUS</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="cursor"></div>

<header>
  <div class="logo">OBVIOUS</div>
</header>

<div class="drawing-overlay">
  <img src="images/30.png" alt="">
</div>

<main class="gallery">

  <div class="tile t1">
    <img src="images/gallery/01.jpg" alt="">
  </div>

  <div class="tile t2">
    <img src="images/gallery/03.jpg" alt="">
  </div>

  <div class="tile t3">
    <img src="images/gallery/04.jpg" alt="">
  </div>

  <div class="tile t4">
    <img src="images/gallery/05.jpg" alt="">
  </div>

  <div class="tile t5">
    <img src="images/gallery/07.jpg" alt="">
  </div>

  <div class="tile t6">
    <img src="images/gallery/08.jpg" alt="">
  </div>

  <div class="tile t7">
    <img src="images/gallery/09.jpg" alt="">
  </div>

  <div class="tile t8">
    <img src="images/gallery/10.jpg" alt="">
  </div>

  <div class="tile t9">
    <img src="images/gallery/11.jpg" alt="">
  </div>

  <div class="tile t10">
    <img src="images/gallery/12.jpg" alt="">
  </div>

  <div class="tile t11">
    <img src="images/gallery/13.png" alt="">
  </div>

  <div class="tile t12">
    <img src="images/gallery/14.jpg" alt="">
  </div>

  <div class="tile t13">
    <img src="images/gallery/15.jpg" alt="">
  </div>

</main>


<section class="page contact-end">

  <div class="contact-content">

    <h1>Contact</h1>

    <p>
      For product inquiries, commissions, availability or further information,
      please get in touch.
    </p>

    <p>
      <a href="mailto:not.so@obvious.ee">
        not.so@obvious.ee
      </a>
    </p>

    <form
      action="https://formsubmit.co/not.so@obvious.ee"
      method="POST">

      <input
        type="hidden"
        name="_subject"
        value="OBVIOUS inquiry">

      <input
        type="hidden"
        name="_captcha"
        value="false">

      <input
        type="hidden"
        name="_template"
        value="table">

      <input
        type="text"
        name="name"
        placeholder="Name"
        required>

      <input
        type="email"
        name="email"
        placeholder="Email"
        required>

      <textarea
        name="message"
        rows="5"
        placeholder="Message"
        required></textarea>

      <button type="submit">
        Send inquiry
      </button>

    </form>

  </div>

</section>


<footer>

  <a href="mailto:not.so@obvious.ee">
    not.so@obvious.ee
  </a>

  <span>
    obvious © 2026
  </span>

</footer>


<script src="script.js"></script>

</body>
</html>
